name: CI

on:
  push:
    branches: [main]
  pull_request:

# a clean checkout with no parent node_modules is the whole point. every
# dependency bug during the open-source split was invisible until the package
# was installed somewhere that did not have an app quietly providing for it.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 cant glob test files and is eol
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # ci, not install: fails if package-lock.json and package.json disagree
      - run: npm ci

      # dist:types typechecks the whole package on the way to emitting .d.ts,
      # and dist:smoke asserts every name core/index.ts promises survived the
      # bundle
      - run: npm run dist

      # new fuzz seeds every run
      - run: npm test
        env:
          FUZZ_BASE: ${{ github.run_number }}000
          FUZZ_SEEDS: 8
          FUZZ_STEPS: 40

      # per frame work has to stay flat as the history grows as it fails on a ratio
      # and not a time. so a slow runner cant trip it
      - run: npm run perf:guard

      # the published artifact is dist/, so verify that is what packs
      - name: Verify the tarball
        run: |
          cd dist
          npm pack --dry-run

  # a person's first minute with the built package, in chromium, firefox and webkit
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit

      # new monkey seeds every run to keep exploring
      - run: npm run e2e -- --project=chromium --project=firefox
        env:
          MONKEY_BASE: ${{ github.run_number }}000

      # linux webkit on a runner is too slow for l3 live, it times out. so it reports but cant
      # fail the build. run e2e:docker for webkit before a release
      - run: npx playwright test --project=webkit --workers=1
        if: success() || failure()
        continue-on-error: true
        env:
          MONKEY_BASE: ${{ github.run_number }}000

      # always, a failed webkit step doesnt fail the job
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 14
